services:
  - type: web
    name: ai-jenkins-devops-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard/app.py --port $PORT --host 0.0.0.0
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
