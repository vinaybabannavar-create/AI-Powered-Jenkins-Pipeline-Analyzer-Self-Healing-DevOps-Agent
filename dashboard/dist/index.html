<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps AI — Production Jenkins Intelligence &amp; Self-Healing Platform</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18, Babel, Chart.js -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg-darkest: #030712;
      --bg-panel: #0b0f19;
      --bg-card: #0f172a;
      --bg-card-hover: #162036;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(99, 102, 241, 0.4);
      --border-glow: rgba(6, 182, 212, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-indigo: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #ef4444;
      --accent-purple: #8b5cf6;
      --sidebar-width: 270px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-darkest);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Ambient cursor spotlight glow */
    #mouse-spotlight {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(
        800px circle at var(--mouse-x, 50vw) var(--mouse-y, 50vh),
        rgba(99, 102, 241, 0.09),
        rgba(6, 182, 212, 0.03) 40%,
        transparent 80%
      );
    }
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 2;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-panel);
      border-right: 1px solid var(--border-subtle);
      position: fixed; top: 0; bottom: 0; left: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 40;
    }
    .sidebar-brand {
      padding: 1.4rem 1.4rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; gap: 12px;
    }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
    }
    .brand-title { font-size: 1.05rem; font-weight: 700; color: #fff; line-height: 1.2; }
    .brand-sub { font-size: 0.7rem; color: var(--accent-cyan); font-weight: 700; letter-spacing: 0.04em; }

    .sidebar-nav {
      padding: 1.2rem 0.8rem;
      display: flex; flex-direction: column; gap: 6px;
      flex: 1; overflow-y: auto;
    }
    .nav-label {
      font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase;
      letter-spacing: 0.12em; font-weight: 700; padding: 0.6rem 0.8rem 0.3rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem;
      border-radius: 10px; color: var(--text-muted); font-size: 0.85rem; font-weight: 500;
      cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; position: relative;
    }
    .nav-item:hover, .nav-item.active {
      color: #fff; background: rgba(99, 102, 241, 0.12);
      border-color: rgba(99, 102, 241, 0.35); box-shadow: 0 0 16px rgba(99, 102, 241, 0.15);
    }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 4px;
      border-radius: 0 4px 4px 0; background: linear-gradient(180deg, var(--accent-cyan), var(--accent-indigo));
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    /* Main Container */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }
    
    .header {
      height: 72px;
      min-height: 72px;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    
    .content-area {
      padding: 2rem;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    /* Spotlight Cards */
    .spotlight-card {
      position: relative; background: var(--bg-card); border-radius: 16px;
      border: 1px solid var(--border-subtle); overflow: hidden;
      transition: border-color 0.25s, transform 0.2s, box-shadow 0.25s;
    }
    .spotlight-card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: radial-gradient(
        350px circle at var(--card-mouse-x, -500px) var(--card-mouse-y, -500px),
        rgba(99, 102, 241, 0.15), rgba(6, 182, 212, 0.05) 50%, transparent 80%
      );
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 1;
    }
    .spotlight-card:hover::before { opacity: 1; }
    .spotlight-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.15);
      transform: translateY(-2px);
    }
    .spotlight-inner { position: relative; z-index: 2; }

    /* Form Controls & Inputs - Obsidian Theme */
    .form-input {
      background: #090d16 !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 10px !important;
      padding: 0.65rem 0.9rem !important;
      font-size: 0.85rem !important;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.5);
    }
    .form-input:focus {
      border-color: var(--accent-indigo) !important;
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.35), inset 0 1px 4px rgba(0, 0, 0, 0.5) !important;
    }
    select.form-input {
      appearance: auto;
      cursor: pointer;
    }
    select.form-input option {
      background: #0b0f19 !important;
      color: #f8fafc !important;
      padding: 8px;
    }
    textarea.form-input {
      resize: vertical;
      line-height: 1.5;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 0.6rem 1.15rem;
      border-radius: 10px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      border: 1px solid transparent; transition: all 0.2s ease; font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.7); transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05); color: var(--text-main);
      border-color: var(--border-subtle);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-chip {
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle);
      color: var(--text-muted); font-size: 0.75rem; padding: 0.35rem 0.75rem; border-radius: 8px;
      cursor: pointer; font-family: 'JetBrains Mono', monospace; transition: all 0.2s;
    }
    .btn-chip:hover {
      background: rgba(99, 102, 241, 0.18); color: #fff; border-color: var(--accent-indigo);
    }

    /* Hero */
    .hero {
      padding: 2.2rem 2.6rem; margin-bottom: 1.8rem;
      background: linear-gradient(135deg, #0b0f19 0%, #151b2e 50%, #0a0d16 100%);
      border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 20px;
    }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(99, 102, 241, 0.15); color: #a5b4fc;
      font-size: 0.72rem; font-weight: 700; padding: 0.35rem 0.9rem;
      border-radius: 20px; border: 1px solid rgba(99, 102, 241, 0.3);
      margin-bottom: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .hero-title { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.8px; color: #fff; margin-bottom: 0.4rem; }
    .hero-title span {
      background: linear-gradient(135deg, #818cf8 0%, #38bdf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* KPI Grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 1.8rem; }
    .kpi-card { padding: 1.3rem 1.1rem; text-align: center; }
    .kpi-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.4rem; }
    .kpi-val { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; line-height: 1; margin-bottom: 0.3rem; }
    .kpi-sub { font-size: 0.72rem; font-weight: 600; }
    .kpi-blue .kpi-val { color: #60a5fa; } .kpi-blue .kpi-sub { color: #3b82f6; }
    .kpi-purple .kpi-val { color: #a78bfa; } .kpi-purple .kpi-sub { color: #8b5cf6; }
    .kpi-cyan .kpi-val { color: #22d3ee; } .kpi-cyan .kpi-sub { color: #06b6d4; }
    .kpi-slate .kpi-val { color: #94a3b8; } .kpi-slate .kpi-sub { color: #64748b; }
    .kpi-green .kpi-val { color: #4ade80; } .kpi-green .kpi-sub { color: #10b981; }
    .kpi-amber .kpi-val { color: #fbbf24; } .kpi-amber .kpi-sub { color: #f59e0b; }

    /* Pipeline Grid */
    .pipe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 1.8rem; }
    .pipe-card { padding: 1.4rem 1.6rem; border-left: 4px solid var(--accent-rose); }
    .pipe-card.SUCCESS { border-left-color: var(--accent-emerald); }
    .pipe-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
    .pipe-name { font-size: 0.8rem; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.08em; }
    .pipe-badge { font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.65rem; border-radius: 6px; }
    .badge-FAILURE { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-SUCCESS { background: rgba(16, 185, 129, 0.15); color: #86efac; border: 1px solid rgba(16, 185, 129, 0.3); }
    .pipe-issue { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
    .pipe-meta { font-size: 0.76rem; color: var(--text-dim); margin-bottom: 0.8rem; }
    .pipe-action {
      font-size: 0.75rem; color: #818cf8; background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 8px; padding: 0.5rem 0.8rem;
      display: flex; align-items: center; gap: 6px;
    }

    /* Architecture Flow Visualizer with Zoom */
    .arch-container {
      background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-subtle);
      padding: 2rem; margin-bottom: 1.8rem; position: relative; overflow: hidden;
    }
    .zoom-toolbar {
      position: absolute; top: 1.5rem; right: 1.5rem; display: flex; align-items: center; gap: 6px;
      z-index: 10; background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 10px; border: 1px solid var(--border-subtle);
    }
    .zoom-btn {
      width: 32px; height: 32px; border-radius: 6px; background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle); color: #fff; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .zoom-btn:hover { background: var(--accent-indigo); }
    .arch-canvas-wrapper {
      overflow: auto; padding: 2.5rem 1rem; min-height: 380px; display: flex; justify-content: center; align-items: center;
    }
    .arch-canvas {
      display: flex; align-items: center; gap: 20px; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }
    .arch-node {
      background: #111827; border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 14px;
      padding: 1.3rem 1.4rem; min-width: 210px; max-width: 240px; text-align: center;
      position: relative; cursor: pointer; transition: all 0.25s;
    }
    .arch-node:hover, .arch-node.active {
      border-color: var(--accent-cyan); box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
      transform: translateY(-4px); background: #151e32;
    }
    .arch-node-num {
      width: 26px; height: 26px; border-radius: 50%; background: var(--accent-indigo);
      color: #fff; font-size: 0.75rem; font-weight: 700; display: inline-flex;
      align-items: center; justify-content: center; margin-bottom: 0.6rem;
    }
    .arch-node-title { font-size: 0.88rem; font-weight: 700; color: #fff; margin-bottom: 0.35rem; }
    .arch-node-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.4; }
    .arch-connector {
      font-size: 1.5rem; color: var(--accent-indigo); animation: flowPulse 2s infinite ease-in-out;
    }
    @keyframes flowPulse {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(5px); }
    }

    /* Web Terminal / CLI Console */
    .terminal-container {
      background: #090d16; border-radius: 16px; border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 1.5rem; margin-bottom: 1.8rem; font-family: 'JetBrains Mono', monospace;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
    }
    .terminal-topbar {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;
      padding-bottom: 0.8rem; border-bottom: 1px solid var(--border-subtle);
    }
    .term-dots { display: flex; gap: 6px; }
    .term-dot { width: 10px; height: 10px; border-radius: 50%; }
    .terminal-output {
      max-height: 360px; overflow-y: auto; color: #e2e8f0; font-size: 0.82rem; line-height: 1.6;
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 1rem;
    }
    .term-input-row { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.4); padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-subtle); }
    .term-prompt { color: var(--accent-emerald); font-weight: 700; font-size: 0.85rem; }
    .term-input {
      background: transparent; border: none; color: #fff; font-family: inherit; font-size: 0.85rem;
      flex: 1; outline: none;
    }

    /* Tables */
    .table-container { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border-subtle); background: var(--bg-card); margin-bottom: 1.8rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
    thead th {
      background: rgba(255, 255, 255, 0.02); color: var(--text-dim); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.08em; padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border-subtle); font-weight: 700;
    }
    tbody td { padding: 0.9rem 1.2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.04); color: #cbd5e1; }
    tbody tr:hover { background: rgba(99, 102, 241, 0.06); }

    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent-emerald);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .ext-link {
      display: inline-flex; align-items: center; gap: 4px; color: var(--accent-cyan);
      text-decoration: none; font-weight: 600; font-size: 0.78rem; padding: 4px 8px;
      border-radius: 6px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.2);
    }
    .ext-link:hover { background: rgba(6, 182, 212, 0.2); text-decoration: underline; }

    @media (max-width: 1200px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .pipe-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .sidebar { width: 70px; }
      .sidebar .brand-title, .sidebar .brand-sub, .sidebar .nav-item span.nav-text, .sidebar-footer, .nav-label { display: none; }
      .main-wrapper { margin-left: 70px; }
      .header { padding: 0 1rem; }
      .content-area { padding: 1.2rem; }
    }
  </style>
</head>
<body>

  <div id="mouse-spotlight"></div>
  <div class="bg-grid"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Mouse Spotlight Position
    document.addEventListener('mousemove', (e) => {
      document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
      document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
      document.querySelectorAll('.spotlight-card').forEach(card => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--card-mouse-x', `${e.clientX - rect.left}px`);
        card.style.setProperty('--card-mouse-y', `${e.clientY - rect.top}px`);
      });
    });

    function App() {
      const [currentView, setCurrentView] = useState('overview');
      const [pipelines, setPipelines] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [actions, setActions] = useState([]);
      const [history, setHistory] = useState([]);
      const [sampleLogs, setSampleLogs] = useState([]);
      const [selectedLogFile, setSelectedLogFile] = useState('');
      const [selectedLogContent, setSelectedLogContent] = useState('');
      const [logAnalysisResult, setLogAnalysisResult] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [archZoom, setArchZoom] = useState(1.0);
      const [activeArchNode, setActiveArchNode] = useState(1);

      // Terminal State
      const [termLines, setTermLines] = useState([
        "🤖 DevOps AI Agent Production Shell v2.0",
        "Autonomous Jenkins Pipeline Remediation Engine",
        "Type 'help' or click quick command chips below.",
        "---------------------------------------------------"
      ]);
      const [termInput, setTermInput] = useState("");

      // Settings State
      const [settings, setSettings] = useState({
        jenkins_url: "http://localhost:5000",
        jenkins_user: "admin",
        jenkins_token: "",
        demo_mode: true,
        auto_heal_enabled: true,
        scan_interval_minutes: 5,
        github_repo: "vinaybabannavar-create/AI-Powered-Jenkins-Pipeline-Analyzer-Self-Healing-DevOps-Agent"
      });
      const [testResult, setTestResult] = useState(null);

      // Load all backend data
      const loadAll = async () => {
        try {
          const [pRes, aRes, actRes, hRes, sRes, logsRes] = await Promise.all([
            fetch('/api/pipelines'),
            fetch('/api/analysis/analytics'),
            fetch('/api/actions'),
            fetch('/api/analysis/history'),
            fetch('/api/settings'),
            fetch('/api/cli/logs')
          ]);

          if (pRes.ok) setPipelines(await pRes.json());
          if (aRes.ok) setAnalytics(await aRes.json());
          if (actRes.ok) setActions(await actRes.json());
          if (hRes.ok) setHistory(await hRes.json());
          if (sRes.ok) setSettings(await sRes.json());
          if (logsRes.ok) {
            const logsData = await logsRes.json();
            const files = logsData.files || [];
            setSampleLogs(files);
            if (files.length > 0) {
              setSelectedLogFile(prev => {
                const target = prev || files[0].filename;
                const found = files.find(f => f.filename === target) || files[0];
                setSelectedLogContent(found.content);
                return found.filename;
              });
            }
          }
        } catch (err) {
          console.error("Failed to load initial data:", err);
        }
      };

      useEffect(() => {
        loadAll();

        // Server-Sent Events
        const es = new EventSource('/api/events');
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.event === 'action_executed') {
              setTermLines(prev => [...prev, `⚡ [ACTION EXECUTED] ${data.data.pipeline} -> ${data.data.action}`]);
              loadAll();
            } else if (data.event === 'scan_started') {
              setTermLines(prev => [...prev, `📡 [SCAN STARTED] ${data.data.message}`]);
            } else if (data.event === 'scan_completed') {
              setTermLines(prev => [...prev, `✅ [SCAN COMPLETE] ${data.data.pipelines_scanned} pipelines analyzed & healed.`]);
              loadAll();
            }
          } catch (err) {}
        };

        return () => es.close();
      }, []);

                            <tr key={a.id}>
                              <td style={{ fontFamily: 'JetBrains Mono', color: 'var(--text-dim)', fontSize: '0.75rem' }}>{a.timestamp}</td>
                              <td><strong style={{ color: '#fff' }}>{a.pipeline}</strong></td>
                              <td>{a.action_type}</td>
                              <td style={{ color: 'var(--accent-cyan)' }}>⚡ {a.description}</td>
                              <td><span style={{ fontSize: '0.68rem', fontWeight: 700, padding: '0.2rem 0.6rem', borderRadius: '6px', background: 'rgba(16,185,129,0.15)', color: '#4ade80' }}>{a.status}</span></td>
                              <td>
                                {a.external_url ? (
                                  <a href={a.external_url} target="_blank" rel="noreferrer" className="ext-link">
                                    🔗 Open Proof ↗
                                  </a>
                                ) : <span style={{ color: 'var(--text-dim)' }}>—</span>}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 6: ANALYTICS & MTTR */}
              {currentView === 'analytics' && (
                <div>
                  <div style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '1.2rem' }}>📊 MTTR Reduction &amp; Anomaly Analytics</div>
                  <div className="kpi-grid" style={{ marginBottom: '1.5rem' }}>
                    <div className="spotlight-card kpi-card kpi-slate"><div className="spotlight-inner"><div className="kpi-label">Manual MTTR</div><div className="kpi-val">15.1 m</div><div className="kpi-sub">Baseline</div></div></div>
                    <div className="spotlight-card kpi-card kpi-green"><div className="spotlight-inner"><div className="kpi-label">Agent MTTR</div><div className="kpi-val">4.6 m</div><div className="kpi-sub">↓ 69.8% Faster</div></div></div>
                    <div className="spotlight-card kpi-card kpi-amber"><div className="spotlight-inner"><div className="kpi-label">Time Saved</div><div className="kpi-val">10.5 m</div><div className="kpi-sub">Per Incident</div></div></div>
                  </div>

                  <div className="spotlight-card table-container">
                    <div className="spotlight-inner">
                      <div style={{ padding: '1.2rem', fontSize: '0.9rem', fontWeight: 700 }}>📋 Historical Analysis Records</div>
                      <table>
                        <thead>
                          <tr>
                            <th>Timestamp</th>
                            <th>Pipeline</th>
                            <th>Failure Type</th>
                            <th>Confidence</th>
                            <th>Source</th>
                            <th>Reason</th>
                            <th>Fix Suggestion</th>
                          </tr>
                        </thead>
                        <tbody>
                          {history.slice(0, 15).map(h => (
                            <tr key={h.id}>
                              <td style={{ fontFamily: 'JetBrains Mono', color: 'var(--text-dim)', fontSize: '0.75rem' }}>{h.timestamp}</td>
                              <td><strong style={{ color: '#fff' }}>{h.pipeline}</strong></td>
                              <td>{h.type}</td>
                              <td><span style={{ fontSize: '0.68rem', fontWeight: 700, padding: '0.2rem 0.5rem', borderRadius: '4px', background: 'rgba(16,185,129,0.15)', color: '#4ade80' }}>{h.confidence}</span></td>
                              <td><span style={{ fontSize: '0.68rem', fontWeight: 600, padding: '0.2rem 0.5rem', borderRadius: '4px', background: 'rgba(96,165,250,0.1)', color: '#60a5fa' }}>{h.source.toUpperCase()}</span></td>
                              <td style={{ color: 'var(--text-muted)' }}>{h.reason}</td>
                              <td style={{ color: '#a5b4fc' }}>{h.fix}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 7: SETTINGS */}
              {currentView === 'settings' && (
                <div>
                  <div className="spotlight-card" style={{ padding: '2.2rem', maxWidth: '780px', margin: '0 auto' }}>
                    <div className="spotlight-inner">
                      <div style={{ fontSize: '1.2rem', fontWeight: 700, marginBottom: '0.5rem' }}>⚙️ Enterprise Jenkins &amp; Integration Settings</div>
                      <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '1.5rem' }}>Configure live Jenkins cluster, GitHub tokens for automated PRs, and Jira credentials with encrypted at-rest security.</div>

                      <div style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.9rem 1.1rem', background: 'rgba(255,255,255,0.02)', borderRadius: '10px', border: '1px solid var(--border-subtle)' }}>
                          <div>
                            <div style={{ fontWeight: 600, fontSize: '0.88rem' }}>Demo Mode (Local Mock Jenkins)</div>
                            <div style={{ fontSize: '0.74rem', color: 'var(--text-dim)' }}>Switch off to connect to your live enterprise Jenkins cluster</div>
                          </div>
                          <input type="checkbox" checked={settings.demo_mode} onChange={e => setSettings({ ...settings, demo_mode: e.target.checked })} style={{ width: '20px', height: '20px', cursor: 'pointer' }} />
                        </div>

                        <div>
                          <label style={{ fontSize: '0.75rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Jenkins Base URL</label>
                          <input className="form-input" type="text" value={settings.jenkins_url || ''} onChange={e => setSettings({ ...settings, jenkins_url: e.target.value })} placeholder="http://localhost:5000 or https://jenkins.company.com" style={{ width: '100%', marginTop: '4px' }} />
                        </div>

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px' }}>
                          <div>
                            <label style={{ fontSize: '0.75rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Jenkins Username</label>
                            <input className="form-input" type="text" value={settings.jenkins_user || ''} onChange={e => setSettings({ ...settings, jenkins_user: e.target.value })} placeholder="admin" style={{ width: '100%', marginTop: '4px' }} />
                          </div>
                          <div>
                            <label style={{ fontSize: '0.75rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Jenkins API Token</label>
                            <input className="form-input" type="password" value={settings.jenkins_token || ''} onChange={e => setSettings({ ...settings, jenkins_token: e.target.value })} placeholder="•••••••••••• (Encrypted at rest)" style={{ width: '100%', marginTop: '4px' }} />
                          </div>
                        </div>

                        <button className="btn btn-secondary" style={{ alignSelf: 'flex-start' }} onClick={async () => {
                          setTestResult({ loading: true });
                          try {
                            const res = await fetch('/api/settings/test-jenkins', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({ jenkins_url: settings.jenkins_url, jenkins_user: settings.jenkins_user, jenkins_token: settings.jenkins_token, demo_mode: settings.demo_mode })
                            });
                            setTestResult(await res.json());
                          } catch (e) {
                            setTestResult({ success: false, message: "Network connection error" });
                          }
                        }}>
                          <span>📡 Test Jenkins Connection</span>
                        </button>

                        {testResult && (
                          <div style={{ padding: '0.8rem 1rem', borderRadius: '8px', background: testResult.success ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)', border: `1px solid ${testResult.success ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)'}`, fontSize: '0.8rem' }}>
                            <strong>{testResult.success ? '✅ Connected: ' : '❌ Connection Failed: '}</strong> {testResult.message}
                          </div>
                        )}

                        <hr style={{ borderColor: 'var(--border-subtle)' }} />

                        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '1rem' }}>
                          <button className="btn btn-primary" onClick={async () => {
                            await fetch('/api/settings', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify(settings)
                            });
                            alert("Settings updated and credentials encrypted successfully!");
                            loadAll();
                          }}>Save &amp; Encrypt Settings</button>
                        </div>

                      </div>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
