<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps AI — Autonomous Jenkins Intelligence &amp; Self-Healing Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- React 18, Babel, Chart.js -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg-black: #000000;
      --bg-surface: #000000;
      --bg-card: #000000;
      --bg-card-hover: #03050a;
      --border-glass: rgba(255, 255, 255, 0.12);
      --border-glow-indigo: rgba(99, 102, 241, 0.5);
      --border-glow-cyan: rgba(6, 182, 212, 0.5);
      --border-glow-emerald: rgba(16, 185, 129, 0.5);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --neon-cyan: #06b6d4;
      --neon-indigo: #6366f1;
      --neon-emerald: #10b981;
      --neon-purple: #a855f7;
      --neon-amber: #f59e0b;
      --neon-rose: #ef4444;
      --neon-fuchsia: #d946ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000000 !important;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      position: relative;
    }

    /* Ambient Background Auroras & Glow */
    .aurora-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; background: #000000;
    }
    .aurora-orb {
      position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.18;
      animation: floatAurora 20s infinite alternate ease-in-out;
    }
    .aurora-1 { width: 650px; height: 650px; background: #4f46e5; top: -100px; left: -100px; }
    .aurora-2 { width: 700px; height: 700px; background: #06b6d4; bottom: -150px; right: -100px; animation-duration: 25s; }
    .aurora-3 { width: 500px; height: 500px; background: #8b5cf6; top: 40%; left: 35%; animation-duration: 18s; opacity: 0.12; }
    
    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-40px, 80px) scale(0.95); }
    }

    /* Cybernetic Grid */
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* Ambient Interactive Mouse Light Spotlight */
    #mouse-spotlight {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(
        800px circle at var(--mouse-x, 50vw) var(--mouse-y, 50vh),
        rgba(6, 182, 212, 0.18),
        rgba(99, 102, 241, 0.12) 35%,
        rgba(168, 85, 247, 0.05) 60%,
        transparent 80%
      );
    }

    .app-layout {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 160px; /* Leave space for bottom floating dock */
      background: #000000;
    }

    /* Top Header Bar */
    .top-header {
      background: #000000 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.95);
    }
    .top-header-inner {
      max-width: 1440px; margin: 0 auto; padding: 0.9rem 2rem;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }

    .brand-section {
      display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none;
    }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
      animation: pulseGlow 4s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
      100% { box-shadow: 0 0 35px rgba(6, 182, 212, 0.7); }
    }
    .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; color: #fff; line-height: 1.1; letter-spacing: -0.5px; }
    .brand-sub { font-size: 0.7rem; color: var(--neon-cyan); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }

    /* Bottom Floating Dock Navigation (Zero Scrollbar, Fully Responsive) */
    .bottom-dock-wrapper {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      padding: 0 1rem;
    }
    .bottom-dock {
      pointer-events: auto;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(99, 102, 241, 0.25);
      max-width: 96vw;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dock-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.6rem 1rem;
      border-radius: 16px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
    }
    .dock-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
    .dock-tab.active {
      color: #fff;
      transform: translateY(-2px);
    }

    /* Distinct Glow per Tab when Active */
    .dock-tab.tab-overview.active {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }
    .dock-tab.tab-flow.active {
      background: rgba(168, 85, 247, 0.18);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
    }
    .dock-tab.tab-cli.active {
      background: rgba(6, 182, 212, 0.18);
      border-color: rgba(6, 182, 212, 0.5);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
    }
    .dock-tab.tab-pipelines.active {
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
    }
    .dock-tab.tab-actions.active {
      background: rgba(244, 63, 94, 0.18);
      border-color: rgba(244, 63, 94, 0.5);
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.35);
    }
    .dock-tab.tab-analytics.active {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
    }
    .dock-tab.tab-settings.active {
      background: rgba(99, 102, 241, 0.18);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.35);
    }

    /* Main Container */
    .content-area {
      padding: 2.2rem;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    /* Glassmorphic Cyber Cards with Moving Border Light */
    @property --border-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .spotlight-card {
      position: relative;
      background: #000000;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .spotlight-card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: radial-gradient(
        400px circle at var(--card-mouse-x, -500px) var(--card-mouse-y, -500px),
        rgba(99, 102, 241, 0.22), rgba(6, 182, 212, 0.12) 50%, transparent 80%
      );
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 1;
    }
    .spotlight-card:hover::before { opacity: 1; }

    /* Animated Border Light beam moving around every card */
    .spotlight-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      padding: 1.5px;
      background: conic-gradient(
        from var(--border-angle, 0deg),
        transparent 60%,
        rgba(6, 182, 212, 0.95) 80%,
        rgba(99, 102, 241, 0.95) 92%,
        transparent 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      animation: borderMove 5s linear infinite;
      z-index: 5;
    }

    @keyframes borderMove {
      to {
        --border-angle: 360deg;
      }
    }

    .spotlight-card:hover {
      border-color: rgba(99, 102, 241, 0.55);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.95), 0 0 35px rgba(6, 182, 212, 0.25);
      transform: translateY(-3px);
    }
    .spotlight-inner { position: relative; z-index: 6; }

    /* High-Level Glowing Jenkins Job Button */
    .btn-jenkins-job {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.45rem 0.95rem;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffffff !important;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 18px rgba(6, 182, 212, 0.4);
      text-decoration: none !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }
    .btn-jenkins-job:hover {
      background: linear-gradient(135deg, #0369a1, #4f46e5);
      box-shadow: 0 0 28px rgba(6, 182, 212, 0.75);
      transform: translateY(-2px);
      color: #ffffff !important;
    }

    /* Multi-Color Legendary Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 0.65rem 1.25rem;
      border-radius: 12px; font-size: 0.84rem; font-weight: 700; cursor: pointer;
      border: 1px solid transparent; transition: all 0.25s ease; font-family: inherit;
      white-space: nowrap; text-decoration: none;
    }
    
    /* Indigo / Scan Button */
    .btn-indigo {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
    }
    .btn-indigo:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.8);
      transform: translateY(-2px);
    }

    /* Emerald Button */
    .btn-emerald {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
    }
    .btn-emerald:hover {
      background: linear-gradient(135deg, #047857, #059669);
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.7);
      transform: translateY(-2px);
    }

    /* Cyan Button */
    .btn-cyan {
      background: linear-gradient(135deg, #0891b2, #06b6d4);
      color: #fff;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
    }
    .btn-cyan:hover {
      background: linear-gradient(135deg, #0e7490, #0891b2);
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.7);
      transform: translateY(-2px);
    }

    /* Purple Button */
    .btn-purple {
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: #fff;
      box-shadow: 0 0 25px rgba(147, 51, 234, 0.4);
    }
    .btn-purple:hover {
      background: linear-gradient(135deg, #6d28d9, #7c3aed);
      box-shadow: 0 0 40px rgba(147, 51, 234, 0.7);
      transform: translateY(-2px);
    }

    /* Secondary Glass Button */
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05); color: var(--text-main);
      border: 1px solid var(--border-glass);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    /* Command Chip */
    .btn-chip {
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glass);
      color: var(--text-muted); font-size: 0.75rem; padding: 0.4rem 0.85rem; border-radius: 10px;
      cursor: pointer; font-family: 'JetBrains Mono', monospace; transition: all 0.2s;
    }
    .btn-chip:hover {
      background: rgba(99, 102, 241, 0.2); color: #fff; border-color: var(--neon-indigo);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }

    /* Hero Banner */
    .hero {
      padding: 2.5rem 3rem; margin-bottom: 2rem;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(10, 15, 29, 0.95) 100%);
      border: 1px solid rgba(99, 102, 241, 0.35); border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.15);
    }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(99, 102, 241, 0.15); color: #a5b4fc;
      font-size: 0.75rem; font-weight: 700; padding: 0.4rem 1rem;
      border-radius: 20px; border: 1px solid rgba(99, 102, 241, 0.35);
      margin-bottom: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .hero-title { font-family: 'Space Grotesk', sans-serif; font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; color: #fff; margin-bottom: 0.5rem; }
    .hero-title span {
      background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 50%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* KPI Grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 2rem; }
    .kpi-card { padding: 1.5rem 1.2rem; text-align: center; }
    .kpi-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 0.5rem; }
    .kpi-val { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; line-height: 1; margin-bottom: 0.35rem; }
    .kpi-sub { font-size: 0.75rem; font-weight: 600; }
    .kpi-blue .kpi-val { color: #60a5fa; text-shadow: 0 0 20px rgba(96, 165, 250, 0.4); } .kpi-blue .kpi-sub { color: #3b82f6; }
    .kpi-purple .kpi-val { color: #c084fc; text-shadow: 0 0 20px rgba(192, 132, 252, 0.4); } .kpi-purple .kpi-sub { color: #a855f7; }
    .kpi-cyan .kpi-val { color: #22d3ee; text-shadow: 0 0 20px rgba(34, 211, 238, 0.4); } .kpi-cyan .kpi-sub { color: #06b6d4; }
    .kpi-slate .kpi-val { color: #cbd5e1; } .kpi-slate .kpi-sub { color: #94a3b8; }
    .kpi-green .kpi-val { color: #4ade80; text-shadow: 0 0 20px rgba(74, 222, 128, 0.4); } .kpi-green .kpi-sub { color: #10b981; }
    .kpi-amber .kpi-val { color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.4); } .kpi-amber .kpi-sub { color: #f59e0b; }

    /* Pipeline Grid */
    .pipe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 2rem; }
    .pipe-card { padding: 1.6rem 1.8rem; border-left: 5px solid var(--neon-rose); }
    .pipe-card.SUCCESS { border-left-color: var(--neon-emerald); }
    .pipe-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.9rem; }
    .pipe-name { font-size: 0.85rem; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.08em; }
    .pipe-badge { font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 8px; }
    .badge-FAILURE { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-SUCCESS { background: rgba(16, 185, 129, 0.18); color: #86efac; border: 1px solid rgba(16, 185, 129, 0.4); }
    .pipe-issue { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 0.45rem; }
    .pipe-meta { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 0.9rem; }
    .pipe-action {
      font-size: 0.78rem; color: #a5b4fc; background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 10px; padding: 0.55rem 0.9rem;
      display: flex; align-items: center; gap: 8px;
    }

    /* Global Scrollbar Suppression - Clean Single Page View */
    ::-webkit-scrollbar {
      width: 0px;
      height: 0px;
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Architecture Flow Visualizer - Auto-Fit Single Page (No Scrollbars) */
    .arch-container {
      background: var(--bg-card); border-radius: 24px; border: 1px solid var(--border-glass);
      padding: 2.2rem; margin-bottom: 2rem; position: relative; overflow: hidden;
    }
    .zoom-toolbar {
      position: absolute; top: 1.8rem; right: 1.8rem; display: flex; align-items: center; gap: 8px;
      z-index: 10; background: rgba(0, 0, 0, 0.7); padding: 6px 10px; border-radius: 12px; border: 1px solid var(--border-glass);
    }
    .zoom-btn {
      width: 34px; height: 34px; border-radius: 8px; background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass); color: #fff; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .zoom-btn:hover { background: var(--neon-indigo); }
    .arch-canvas-wrapper {
      overflow: hidden; padding: 2rem 0.5rem; min-height: 280px; display: flex; justify-content: center; align-items: center; width: 100%;
    }
    .arch-canvas {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; max-width: 100%;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }
    .arch-node {
      background: #090e1a; border: 1px solid rgba(99, 102, 241, 0.35); border-radius: 16px;
      padding: 1.2rem 0.75rem; flex: 1; min-width: 0; text-align: center;
      position: relative; cursor: pointer; transition: all 0.25s;
    }
    .arch-node:hover, .arch-node.active {
      border-color: var(--neon-cyan); box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
      transform: translateY(-4px); background: #0f172a;
    }
    .arch-node-num {
      width: 26px; height: 26px; border-radius: 50%; background: var(--neon-indigo);
      color: #fff; font-size: 0.75rem; font-weight: 700; display: inline-flex;
      align-items: center; justify-content: center; margin-bottom: 0.5rem;
    }
    .arch-node-title { font-size: 0.88rem; font-weight: 700; color: #fff; margin-bottom: 0.35rem; }
    .arch-node-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.35; }
    .arch-connector {
      font-size: 1.2rem; color: var(--neon-indigo); flex-shrink: 0; animation: flowPulse 2s infinite ease-in-out;
    }
    @keyframes flowPulse {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(4px); color: var(--neon-cyan); }
    }

    /* Web Terminal / CLI Console */
    .terminal-container {
      background: #03060d; border-radius: 20px; border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 1.8rem; margin-bottom: 2rem; font-family: 'JetBrains Mono', monospace;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(99, 102, 241, 0.15);
    }
    .terminal-topbar {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem;
      padding-bottom: 0.9rem; border-bottom: 1px solid var(--border-glass);
    }
    .term-dots { display: flex; gap: 8px; }
    .term-dot { width: 12px; height: 12px; border-radius: 50%; }
    .terminal-output {
      max-height: 380px; overflow-y: auto; color: #e2e8f0; font-size: 0.84rem; line-height: 1.65;
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.2rem;
    }
    .term-input-row { display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.5); padding: 0.7rem 1rem; border-radius: 12px; border: 1px solid var(--border-glass); }
    .term-prompt { color: var(--neon-emerald); font-weight: 700; font-size: 0.88rem; }
    .term-input {
      background: transparent; border: none; color: #fff; font-family: inherit; font-size: 0.88rem;
      flex: 1; outline: none;
    }

    /* Form Inputs */
    .form-input {
      background: #050811 !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 12px !important;
      padding: 0.75rem 1rem !important;
      font-size: 0.88rem !important;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--neon-indigo) !important;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4) !important;
    }
    select.form-input { appearance: auto; cursor: pointer; }
    select.form-input option { background: #080c18 !important; color: #f8fafc !important; padding: 8px; }
    textarea.form-input { resize: vertical; line-height: 1.5; }

    /* Tables & Remediation Center */
    .table-container { overflow: hidden; border-radius: 20px; border: 1px solid var(--border-glass); background: #060913; margin-bottom: 2rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9); }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; text-align: left; }
    thead th {
      background: #090e1d; color: #94a3b8; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.1em; padding: 1.1rem 1.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-weight: 700;
    }
    tbody td { padding: 1.1rem 1.4rem; border-bottom: 1px solid rgba(255, 255, 255, 0.04); color: #cbd5e1; vertical-align: middle; }
    tbody tr { transition: background 0.2s ease; }
    tbody tr:hover { background: rgba(99, 102, 241, 0.07); }

    .pipeline-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; font-weight: 700;
      color: #93c5fd; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.25rem 0.65rem; border-radius: 8px; display: inline-block;
    }

    .type-pill {
      font-size: 0.74rem; font-weight: 700; padding: 0.25rem 0.65rem; border-radius: 8px; display: inline-block;
      white-space: nowrap;
    }
    .type-pill.Flaky-Test { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .type-pill.Dependency-Issue { background: rgba(6, 182, 212, 0.15); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.35); }
    .type-pill.Infrastructure-Issue { background: rgba(168, 85, 247, 0.15); color: #e9d5ff; border: 1px solid rgba(168, 85, 247, 0.35); }
    .type-pill.Timeout { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .type-pill.Code-Defect { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.35); }
    .type-pill.Configuration-Error { background: rgba(99, 102, 241, 0.15); color: #c7d2fe; border: 1px solid rgba(99, 102, 241, 0.35); }

    .btn-inspect {
      background: rgba(255, 255, 255, 0.06); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.35rem 0.8rem; border-radius: 8px; font-size: 0.76rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-inspect:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-1px); }

    .btn-proof {
      background: linear-gradient(135deg, #0284c7, #06b6d4); color: #fff; border: 1px solid rgba(6, 182, 212, 0.4);
      padding: 0.35rem 0.85rem; border-radius: 8px; font-size: 0.76rem; font-weight: 700;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); transition: all 0.2s ease;
    }
    .btn-proof:hover { background: linear-gradient(135deg, #0369a1, #0284c7); box-shadow: 0 0 25px rgba(6, 182, 212, 0.6); transform: translateY(-1px); }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 1.5rem;
    }
    .modal-card {
      background: #080d1a; border: 1px solid rgba(99, 102, 241, 0.45); border-radius: 20px;
      max-width: 700px; width: 100%; box-shadow: 0 25px 70px rgba(0,0,0,0.95), 0 0 40px rgba(99,102,241,0.3);
      overflow: hidden; animation: modalFadeIn 0.25s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 1200px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .pipe-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .top-header-inner { padding: 0.8rem 1rem; }
      .content-area { padding: 1.2rem; }
      .dock-tab { padding: 0.5rem 0.7rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <!-- Background Auroras, Grid & Spotlight -->
  <div class="aurora-container">
    <div class="aurora-orb aurora-1"></div>
    <div class="aurora-orb aurora-2"></div>
    <div class="aurora-orb aurora-3"></div>
  </div>
  <div class="bg-grid"></div>
  <div id="mouse-spotlight"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Mouse Spotlight Position
    document.addEventListener('mousemove', (e) => {
      document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
      document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
      document.querySelectorAll('.spotlight-card').forEach(card => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--card-mouse-x', `${e.clientX - rect.left}px`);
        card.style.setProperty('--card-mouse-y', `${e.clientY - rect.top}px`);
      });
    });

    function App() {
      const [currentView, setCurrentView] = useState('overview');
      const [pipelines, setPipelines] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [actions, setActions] = useState([]);
      const [history, setHistory] = useState([]);
      const [sampleLogs, setSampleLogs] = useState([]);
      const [selectedLogFile, setSelectedLogFile] = useState('');
      const [selectedLogContent, setSelectedLogContent] = useState('');
      const [logAnalysisResult, setLogAnalysisResult] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [archZoom, setArchZoom] = useState(1.0);
      const [activeArchNode, setActiveArchNode] = useState(1);
      const [selectedActionModal, setSelectedActionModal] = useState(null);

      // Terminal State
      const [termLines, setTermLines] = useState([
        "🤖 DevOps AI Agent Production Shell v2.0",
        "Autonomous Jenkins Pipeline Remediation Engine",
        "Type 'help' or click quick command chips below.",
        "---------------------------------------------------"
      ]);
      const [termInput, setTermInput] = useState("");

      // Settings State
      const [settings, setSettings] = useState({
        jenkins_url: "http://localhost:5000",
        jenkins_user: "admin",
        jenkins_token: "",
        demo_mode: true,
        auto_heal_enabled: true,
        scan_interval_minutes: 5,
        github_repo: "vinaybabannavar-create/AI-Powered-Jenkins-Pipeline-Analyzer-Self-Healing-DevOps-Agent"
      });
      const [testResult, setTestResult] = useState(null);

      // Load all backend data
      const loadAll = async () => {
        try {
          const [pRes, aRes, actRes, hRes, sRes, logsRes] = await Promise.all([
            fetch('/api/pipelines'),
            fetch('/api/analysis/analytics'),
            fetch('/api/actions'),
            fetch('/api/analysis/history'),
            fetch('/api/settings'),
            fetch('/api/cli/logs')
          ]);

          if (pRes.ok) setPipelines(await pRes.json());
          if (aRes.ok) setAnalytics(await aRes.json());
          if (actRes.ok) setActions(await actRes.json());
          if (hRes.ok) setHistory(await hRes.json());
          if (sRes.ok) setSettings(await sRes.json());
          if (logsRes.ok) {
            const logsData = await logsRes.json();
            const files = logsData.files || [];
            setSampleLogs(files);
            if (files.length > 0) {
              setSelectedLogFile(prev => {
                const target = prev || files[0].filename;
                const found = files.find(f => f.filename === target) || files[0];
                setSelectedLogContent(found.content);
                return found.filename;
              });
            }
          }
        } catch (err) {
          console.error("Failed to load initial data:", err);
        }
      };

      useEffect(() => {
        loadAll();

        // Server-Sent Events
        const es = new EventSource('/api/events');
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.event === 'action_executed') {
              setTermLines(prev => [...prev, `⚡ [ACTION EXECUTED] ${data.data.pipeline} -> ${data.data.action}`]);
              loadAll();
            } else if (data.event === 'scan_started') {
              setTermLines(prev => [...prev, `📡 [SCAN STARTED] ${data.data.message}`]);
            } else if (data.event === 'scan_completed') {
              setTermLines(prev => [...prev, `✅ [SCAN COMPLETE] ${data.data.pipelines_scanned} pipelines analyzed & healed.`]);
              loadAll();
            }
          } catch (err) {}
        };

        return () => es.close();
      }, []);

      // Run Native Analysis
      const handleRunAnalysis = async () => {
        setIsScanning(true);
        setTermLines(prev => [...prev, `$ run agent`, `⏳ Executing AI Dual-Layer Analysis & Autonomous Remediation...`]);
        try {
          const res = await fetch('/api/run-agent', { method: 'POST' });
          const data = await res.json();
          setTermLines(prev => [...prev, `✅ Analysis completed successfully across ${data.total_pipelines || 3} pipelines!`]);
          await loadAll();
        } catch (err) {
          setTermLines(prev => [...prev, `❌ Error during execution: ${err.message}`]);
        } finally {
          setIsScanning(false);
        }
      };

      // Handle Terminal Commands
      const handleTerminalSubmit = async (e) => {
        if (e) e.preventDefault();
        const cmd = termInput.trim();
        if (!cmd) return;

        setTermLines(prev => [...prev, `devops@ai-agent:~$ ${cmd}`]);
        setTermInput("");

        if (cmd.toLowerCase() === 'clear') {
          setTermLines(["Terminal cleared."]);
          return;
        }

        if (cmd.toLowerCase() === 'help') {
          setTermLines(prev => [
            ...prev,
            "Available Commands:",
            "  analyze all       - Analyze all 20 historical log files",
            "  analyze <log.txt> - Analyze specific log (e.g. analyze log4.txt)",
            "  run agent         - Run Jenkins Pipeline Agent & Self-Healing",
            "  status            - Show system health & MTTR metrics",
            "  clear             - Clear terminal screen"
          ]);
          return;
        }

        try {
          const res = await fetch('/api/cli/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: cmd, target: cmd.split(' ')[1] })
          });
          const result = await res.json();

          if (result.status === 'success') {
            if (result.command === 'analyze all') {
              setTermLines(prev => [
                ...prev,
                `✅ Analyzed ${result.total_analyzed} logs successfully.`,
                `   MTTR Before: ${result.mttr.without_ai} min -> MTTR After: ${result.mttr.with_ai} min (Improvement: ${result.mttr.improvement})`,
                `   Distribution: ${JSON.stringify(result.distribution)}`
              ]);
            } else if (result.file) {
              setTermLines(prev => [
                ...prev,
                `📄 Log: ${result.file}`,
                `   Type: ${result.result.type} [${result.result.confidence}] via ${result.result.source}`,
                `   Reason: ${result.result.reason}`,
                `   Fix: ${result.result.fix}`
              ]);
            } else {
              setTermLines(prev => [...prev, `✅ Result: ${JSON.stringify(result)}`]);
            }
          } else {
            setTermLines(prev => [...prev, `⚠️ ${result.message || 'Command executed.'}`]);
          }
        } catch (err) {
          setTermLines(prev => [...prev, `❌ Error: ${err.message}`]);
        }
      };

      // Select and Analyze single log file
      const handleSelectLog = (fname) => {
        setSelectedLogFile(fname);
        const f = sampleLogs.find(l => l.filename === fname);
        if (f) {
          setSelectedLogContent(f.content);
          setLogAnalysisResult(null);
        }
      };

      const handleAnalyzeSelectedLog = async () => {
        try {
          const res = await fetch('/api/cli/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: `analyze ${selectedLogFile}`, target: selectedLogFile })
          });
          const data = await res.json();
          if (data.status === 'success') {
            setLogAnalysisResult(data.result);
          }
        } catch (err) {
          alert("Analysis failed: " + err.message);
        }
      };

      return (
        <div className="app-layout">
          {/* Top Sticky Header */}
          <header className="top-header">
            <div className="top-header-inner">
              <div className="brand-section" onClick={() => setCurrentView('overview')}>
                <div className="brand-icon">🤖</div>
                <div>
                  <div className="brand-title">DevOps AI</div>
                  <div className="brand-sub">Self-Healing Platform</div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginLeft: '16px', padding: '0.35rem 0.85rem', background: 'rgba(16,185,129,0.12)', border: '1px solid rgba(16,185,129,0.3)', borderRadius: '20px' }}>
                  <div className="pulse-dot"></div>
                  <span style={{ fontSize: '0.74rem', color: 'var(--neon-emerald)', fontWeight: 700 }}>Agent Active</span>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <span style={{ fontSize: '0.74rem', fontWeight: 700, padding: '0.4rem 0.9rem', borderRadius: '20px', background: 'rgba(99,102,241,0.18)', color: '#a5b4fc', border: '1px solid rgba(99,102,241,0.35)' }}>
                  {settings.demo_mode ? '🟢 DEMO MODE' : '🌐 REAL JENKINS'}
                </span>
                <button className="btn btn-secondary" onClick={() => setCurrentView('settings')}>
                  <span>⚙️ Settings</span>
                </button>
                <button className="btn btn-indigo" onClick={handleRunAnalysis} disabled={isScanning}>
                  <span>{isScanning ? '⏳ Scanning...' : '⚡ Trigger AI Scan'}</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Full-Width Content Area */}
          <main className="content-area">
            {/* PAGE 1: OVERVIEW */}
            {currentView === 'overview' && (
              <div>
                <div className="spotlight-card hero">
                  <div className="spotlight-inner">
                    <div className="hero-eyebrow">⚡ Hack2Hire 1.0 — Problem 08 — Autonomous Pipeline Remediation</div>
                    <h1 className="hero-title">Production <span>Jenkins</span> Self-Healing Agent</h1>
                    <p style={{ color: 'var(--text-muted)', fontSize: '0.98rem' }}>
                      Dual-Layer AI Classifier (Regex + Gemini 3.5 Flash Lite) · Live GitHub PRs &amp; Jira Tickets · 69.8% MTTR Reduction
                    </p>
                  </div>
                </div>

                {/* 6 KPI Cards */}
                <div className="kpi-grid">
                  <div className="spotlight-card kpi-card kpi-blue"><div className="spotlight-inner"><div className="kpi-label">Total Logs</div><div className="kpi-val">{analytics?.total_logs || 20}</div><div className="kpi-sub">Analyzed</div></div></div>
                  <div className="spotlight-card kpi-card kpi-purple"><div className="spotlight-inner"><div className="kpi-label">Regex Layer 1</div><div className="kpi-val">{analytics?.source_counts?.regex || 18}</div><div className="kpi-sub">Deterministic</div></div></div>
                  <div className="spotlight-card kpi-card kpi-cyan"><div className="spotlight-inner"><div className="kpi-label">Gemini LLM</div><div className="kpi-val">{analytics?.source_counts?.llm || 2}</div><div className="kpi-sub">3.5 Flash Lite</div></div></div>
                  <div className="spotlight-card kpi-card kpi-slate"><div className="spotlight-inner"><div className="kpi-label">MTTR Before</div><div className="kpi-val">15.1</div><div className="kpi-sub">Minutes (Manual)</div></div></div>
                  <div className="spotlight-card kpi-card kpi-green"><div className="spotlight-inner"><div className="kpi-label">MTTR After</div><div className="kpi-val">4.6</div><div className="kpi-sub">↓ 69.8% Faster</div></div></div>
                  <div className="spotlight-card kpi-card kpi-amber"><div className="spotlight-inner"><div className="kpi-label">Time Saved</div><div className="kpi-val">10.5</div><div className="kpi-sub">Min / Issue Saved</div></div></div>
                </div>

                {/* 3 Live Pipelines */}
                <div style={{ marginBottom: '2rem' }}>
                  <div style={{ fontSize: '0.85rem', fontWeight: 700, color: 'var(--text-dim)', textTransform: 'uppercase', letterSpacing: '0.12em', marginBottom: '1rem' }}>
                    📡 Active Jenkins Pipelines
                  </div>
                  <div className="pipe-grid">
                    {pipelines.map(p => (
                      <div key={p.name} className={`spotlight-card pipe-card ${p.status}`}>
                        <div className="spotlight-inner">
                          <div className="pipe-top">
                            <div className="pipe-name">{p.name.replace(/-/g, ' ')}</div>
                            <span className={`pipe-badge badge-${p.status}`}>{p.status}</span>
                          </div>
                          <div className="pipe-issue">{p.failure_type || 'Healthy'}</div>
                          <div className="pipe-meta">Build #{p.build} &nbsp;·&nbsp; {p.duration_sec}s &nbsp;·&nbsp; ✅ {p.tests_pass} &nbsp; ❌ {p.tests_fail}</div>
                          <div className="pipe-action"><span>⚡</span><span>{p.action || 'Monitoring'}</span></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 2: HOW IT WORKS (FLOW VISUALIZER WITH ZOOM) */}
            {currentView === 'how_it_works' && (
              <div>
                <div className="arch-container">
                  <div className="zoom-toolbar">
                    <button className="zoom-btn" title="Zoom In" onClick={() => setArchZoom(z => Math.min(z + 0.15, 1.8))}>+</button>
                    <button className="zoom-btn" title="Zoom Out" onClick={() => setArchZoom(z => Math.max(z - 0.15, 0.6))}>−</button>
                    <button className="zoom-btn" title="Reset Zoom" style={{ width: 'auto', padding: '0 10px', fontSize: '0.74rem' }} onClick={() => setArchZoom(1.0)}>Reset</button>
                  </div>

                  <div style={{ marginBottom: '1.2rem' }}>
                    <div style={{ fontSize: '1.2rem', fontWeight: 700 }}>Interactive 5-Step Autonomous Healing Architecture</div>
                    <div style={{ fontSize: '0.84rem', color: 'var(--text-muted)' }}>Click any node to inspect technical internals and execution logic. Use zoom controls at top right.</div>
                  </div>

                  <div className="arch-canvas-wrapper">
                    <div className="arch-canvas" style={{ transform: `scale(${archZoom})` }}>
                      
                      {/* Step 1 */}
                      <div className={`arch-node ${activeArchNode === 1 ? 'active' : ''}`} onClick={() => setActiveArchNode(1)}>
                        <div className="arch-node-num">1</div>
                        <div className="arch-node-title">Jenkins Ingestion</div>
                        <div className="arch-node-desc">Polls REST API / Webhook for console logs &amp; JUnit XML</div>
                      </div>

                      <div className="arch-connector">➔</div>

                      {/* Step 2 */}
                      <div className={`arch-node ${activeArchNode === 2 ? 'active' : ''}`} onClick={() => setActiveArchNode(2)}>
                        <div className="arch-node-num">2</div>
                        <div className="arch-node-title">Layer 1: Regex</div>
                        <div className="arch-node-desc">Deterministic fast pattern classifier (&lt;5ms execution)</div>
                      </div>

                      <div className="arch-connector">➔</div>

                      {/* Step 3 */}
                      <div className={`arch-node ${activeArchNode === 3 ? 'active' : ''}`} onClick={() => setActiveArchNode(3)}>
                        <div className="arch-node-num">3</div>
                        <div className="arch-node-title">Layer 2: Gemini LLM</div>
                        <div className="arch-node-desc">Few-shot prompted 3.5 Flash Lite for ambiguous anomalies</div>
                      </div>

                      <div className="arch-connector">➔</div>

                      {/* Step 4 */}
                      <div className={`arch-node ${activeArchNode === 4 ? 'active' : ''}`} onClick={() => setActiveArchNode(4)}>
                        <div className="arch-node-num">4</div>
                        <div className="arch-node-title">Healing Execution</div>
                        <div className="arch-node-desc">Jenkins Retry / GitHub PR / Jira Ticket creation</div>
                      </div>

                      <div className="arch-connector">➔</div>

                      {/* Step 5 */}
                      <div className={`arch-node ${activeArchNode === 5 ? 'active' : ''}`} onClick={() => setActiveArchNode(5)}>
                        <div className="arch-node-num">5</div>
                        <div className="arch-node-title">Live Telemetry &amp; DB</div>
                        <div className="arch-node-desc">Stores in SQLite/Postgres &amp; streams SSE events</div>
                      </div>

                    </div>
                  </div>

                  {/* Step Details Box */}
                  <div style={{ marginTop: '1.8rem', padding: '1.6rem', borderRadius: '16px', background: 'rgba(255,255,255,0.03)', border: '1px solid var(--border-glass)' }}>
                    <div style={{ fontSize: '1rem', fontWeight: 700, color: 'var(--neon-cyan)', marginBottom: '0.4rem' }}>
                      {activeArchNode === 1 && "Step 1: REST API Jenkins Ingestion"}
                      {activeArchNode === 2 && "Step 2: Layer 1 Deterministic Regex Classification"}
                      {activeArchNode === 3 && "Step 3: Layer 2 Gemini 3.5 Flash Lite LLM Fallback"}
                      {activeArchNode === 4 && "Step 4: Autonomous Self-Healing Remediation"}
                      {activeArchNode === 5 && "Step 5: Relational Persistence & Real-time WebSockets/SSE"}
                    </div>
                    <div style={{ fontSize: '0.86rem', color: 'var(--text-muted)', lineHeight: 1.6 }}>
                      {activeArchNode === 1 && "The agent connects to Jenkins at /job/{name}/lastBuild/consoleText and /testReport/api/json via Basic Auth with encrypted API tokens. In Demo Mode, it reads from the local 20 labeled datasets."}
                      {activeArchNode === 2 && "Scans for 6 failure categories (Flaky Test, Dependency Issue, Infrastructure Issue, Code Defect, Configuration Error, Timeout) in sub-millisecond time. Resolves 90% of failures instantly."}
                      {activeArchNode === 3 && "When confidence is Low or pattern matching is inconclusive, the full console trace is sent to Google Gemini 3.5 Flash Lite to reason over the root cause and generate structured remediation JSON."}
                      {activeArchNode === 4 && "Directly triggers the fix: Auto-retries flaky tests with backoff via Jenkins API, opens GitHub Pull Requests for missing packages or syntax errors, files Atlassian Jira bugs, or alerts ops."}
                      {activeArchNode === 5 && "Every event, failure analysis, and external URL is saved in SQLAlchemy database and broadcasted live to connected web clients via Server-Sent Events."}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 3: WEB CLI & LOG INSPECTOR */}
            {currentView === 'terminal' && (
              <div>
                <div className="terminal-container">
                  <div className="terminal-topbar">
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <div className="term-dots">
                        <div className="term-dot" style={{ background: '#ef4444' }}></div>
                        <div className="term-dot" style={{ background: '#f59e0b' }}></div>
                        <div className="term-dot" style={{ background: '#10b981' }}></div>
                      </div>
                      <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>devops-ai-agent@production-cli</span>
                    </div>
                    <div style={{ fontSize: '0.74rem', color: 'var(--text-dim)' }}>Interactive Web Shell</div>
                  </div>

                  <div className="terminal-output">
                    {termLines.map((line, idx) => (
                      <div key={idx}>{line}</div>
                    ))}
                  </div>

                  <form className="term-input-row" onSubmit={handleTerminalSubmit}>
                    <span className="term-prompt">devops@ai-agent:~$</span>
                    <input className="term-input" type="text" placeholder="Type command (e.g. 'analyze all', 'analyze log1.txt', 'help')..." value={termInput} onChange={e => setTermInput(e.target.value)} />
                    <button type="submit" className="btn btn-emerald" style={{ padding: '0.35rem 1rem', fontSize: '0.78rem' }}>Send</button>
                  </form>

                  {/* Quick Command Chips */}
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '1.2rem', flexWrap: 'wrap' }}>
                    <span style={{ fontSize: '0.74rem', color: 'var(--text-dim)' }}>Quick Chips:</span>
                    <button className="btn-chip" onClick={() => { setTermInput("analyze all"); }}>analyze all</button>
                    <button className="btn-chip" onClick={() => { setTermInput("analyze log4.txt"); }}>analyze log4.txt (Flaky)</button>
                    <button className="btn-chip" onClick={() => { setTermInput("analyze log1.txt"); }}>analyze log1.txt (Dep)</button>
                    <button className="btn-chip" onClick={() => { setTermInput("run agent"); }}>run agent</button>
                    <button className="btn-chip" onClick={() => { setTermInput("clear"); }}>clear</button>
                  </div>
                </div>

                {/* Single Log Inspector */}
                <div className="spotlight-card" style={{ padding: '2rem' }}>
                  <div className="spotlight-inner">
                    <div style={{ fontSize: '1.05rem', fontWeight: 700, marginBottom: '0.9rem' }}>📄 Raw Log File Inspector (All 20 Datasets)</div>
                    <div style={{ display: 'flex', gap: '14px', marginBottom: '1.4rem', alignItems: 'center' }}>
                      <select className="form-input" style={{ width: '260px' }} value={selectedLogFile} onChange={e => handleSelectLog(e.target.value)}>
                        {sampleLogs.map(l => (
                          <option key={l.filename} value={l.filename}>{l.filename} ({l.size} B)</option>
                        ))}
                      </select>
                      <button className="btn btn-cyan" onClick={handleAnalyzeSelectedLog}>⚡ Analyze This Log</button>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px' }}>
                      <div>
                        <div style={{ fontSize: '0.78rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700, marginBottom: '8px' }}>Raw Log Content:</div>
                        <textarea className="form-input" style={{ width: '100%', height: '180px', fontFamily: 'JetBrains Mono', fontSize: '0.8rem' }} readOnly value={selectedLogContent}></textarea>
                      </div>
                      <div>
                        <div style={{ fontSize: '0.78rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700, marginBottom: '8px' }}>AI Classification &amp; Remediation:</div>
                        {logAnalysisResult ? (
                          <div style={{ background: '#070b14', border: '1px solid rgba(99, 102, 241, 0.35)', borderRadius: '12px', padding: '1.2rem', fontSize: '0.84rem', height: '180px', overflowY: 'auto' }}>
                            <div style={{ marginBottom: '5px' }}><strong>Type:</strong> <span style={{ color: 'var(--neon-cyan)' }}>{logAnalysisResult.type}</span></div>
                            <div style={{ marginBottom: '5px' }}><strong>Category:</strong> {logAnalysisResult.category}</div>
                            <div style={{ marginBottom: '5px' }}><strong>Confidence:</strong> <span style={{ color: 'var(--neon-emerald)' }}>{logAnalysisResult.confidence}</span></div>
                            <div style={{ marginBottom: '5px' }}><strong>Source:</strong> {logAnalysisResult.source}</div>
                            <div style={{ marginBottom: '5px' }}><strong>Reason:</strong> {logAnalysisResult.reason}</div>
                            <div><strong>Recommended Fix:</strong> <span style={{ color: '#a5b4fc' }}>{logAnalysisResult.fix}</span></div>
                          </div>
                        ) : (
                          <div style={{ background: '#070b14', border: '1px solid var(--border-glass)', borderRadius: '12px', height: '180px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-dim)', fontSize: '0.84rem' }}>
                            Click 'Analyze This Log' to view AI diagnosis.
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 4: LIVE PIPELINES */}
            {currentView === 'pipelines' && (
              <div>
                <div style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: '1.3rem' }}>📡 Real-Time Jenkins Pipeline Telemetry</div>
                <div className="pipe-grid">
                  {pipelines.map(p => (
                    <div key={p.name} className={`spotlight-card pipe-card ${p.status}`}>
                      <div className="spotlight-inner">
                        <div className="pipe-top">
                          <div className="pipe-name">{p.name.replace(/-/g, ' ')}</div>
                          <span className={`pipe-badge badge-${p.status}`}>{p.status}</span>
                        </div>
                        <div className="pipe-issue">{p.failure_type || 'Healthy / Monitored'}</div>
                        <div className="pipe-meta">Build #{p.build} &nbsp;·&nbsp; {p.duration_sec}s &nbsp;·&nbsp; ✅ {p.tests_pass} &nbsp; ❌ {p.tests_fail}</div>
                        
                        {/* Stage Flow */}
                        <div style={{ display: 'flex', gap: '4px', margin: '1.1rem 0' }}>
                          <div style={{ flex: 1, height: '5px', background: 'var(--neon-emerald)', borderRadius: '3px' }} title="Checkout: SUCCESS"></div>
                          <div style={{ flex: 1, height: '5px', background: 'var(--neon-emerald)', borderRadius: '3px' }} title="Build: SUCCESS"></div>
                          <div style={{ flex: 1, height: '5px', background: p.status === 'SUCCESS' ? 'var(--neon-emerald)' : 'var(--neon-rose)', borderRadius: '3px' }} title="Test: FAILED"></div>
                          <div style={{ flex: 1, height: '5px', background: p.status === 'SUCCESS' ? 'var(--neon-emerald)' : '#334155', borderRadius: '3px' }} title="Deploy: ABORTED"></div>
                        </div>

                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px' }}>
                          <div className="pipe-action" style={{ flex: 1, minWidth: 0 }}><span>⚡</span><span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.action || 'Auto-healing active'}</span></div>
                          <a href={`http://localhost:5000/job/${p.name}`} target="_blank" rel="noreferrer" className="btn-jenkins-job">
                            ⚙️ Open Jenkins Job ↗
                          </a>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PAGE 5: SELF-HEALING ACTIONS */}
            {currentView === 'actions' && (
              <div>
                <div className="spotlight-card table-container">
                  <div style={{ padding: '1.4rem 1.8rem', borderBottom: '1px solid rgba(255,255,255,0.08)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#080d19' }}>
                    <div>
                      <h3 style={{ fontSize: '1.15rem', fontWeight: 700, color: '#fff' }}>🛠 Autonomous Remediation Center &amp; Proof Links</h3>
                      <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '4px' }}>Live audit trail of automated build retries, GitHub pull requests, and Jira tickets</p>
                    </div>
                    <span className="pipe-badge badge-SUCCESS">AUTONOMOUS ENGINE ACTIVE</span>
                  </div>
                  <div className="spotlight-inner">
                    <table>
                      <thead>
                        <tr>
                          <th>Timestamp</th>
                          <th>Pipeline</th>
                          <th>Failure Type</th>
                          <th>Autonomous Action</th>
                          <th>Status</th>
                          <th>Inspect / Proof</th>
                        </tr>
                      </thead>
                      <tbody>
                        {actions.map(a => {
                          const typeClass = (a.action_type || '').replace(/\s+/g, '-');
                          return (
                            <tr key={a.id}>
                              <td style={{ fontFamily: 'JetBrains Mono', color: '#94a3b8', fontSize: '0.78rem' }}>{a.timestamp}</td>
                              <td>
                                <span className="pipeline-tag">{a.pipeline}</span>
                              </td>
                              <td>
                                <span className={`type-pill ${typeClass}`}>{a.action_type}</span>
                              </td>
                              <td style={{ color: '#38bdf8', fontSize: '0.82rem', fontWeight: 600 }}>⚡ {a.description}</td>
                              <td>
                                <span style={{ fontSize: '0.7rem', fontStyle: 'normal', fontWeight: 700, padding: '0.25rem 0.65rem', borderRadius: '6px', background: 'rgba(16,185,129,0.18)', color: '#4ade80', border: '1px solid rgba(16,185,129,0.3)' }}>
                                  {a.status}
                                </span>
                              </td>
                              <td>
                                <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                                  <button className="btn-inspect" onClick={() => setSelectedActionModal(a)}>
                                    🔍 Inspect
                                  </button>
                                  {a.external_url ? (
                                    <a href={a.external_url} target="_blank" rel="noreferrer" className="btn-proof">
                                      🔗 Proof ↗
                                    </a>
                                  ) : null}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 6: ANALYTICS & MTTR */}
            {currentView === 'analytics' && (
              <div>
                <div style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: '1.3rem' }}>📊 MTTR Reduction &amp; Anomaly Analytics</div>
                <div className="kpi-grid" style={{ marginBottom: '1.8rem' }}>
                  <div className="spotlight-card kpi-card kpi-slate"><div className="spotlight-inner"><div className="kpi-label">Manual MTTR</div><div className="kpi-val">15.1 m</div><div className="kpi-sub">Baseline</div></div></div>
                  <div className="spotlight-card kpi-card kpi-green"><div className="spotlight-inner"><div className="kpi-label">Agent MTTR</div><div className="kpi-val">4.6 m</div><div className="kpi-sub">↓ 69.8% Faster</div></div></div>
                  <div className="spotlight-card kpi-card kpi-amber"><div className="spotlight-inner"><div className="kpi-label">Time Saved</div><div className="kpi-val">10.5 m</div><div className="kpi-sub">Per Incident</div></div></div>
                </div>

                <div className="spotlight-card table-container">
                  <div className="spotlight-inner">
                    <div style={{ padding: '1.3rem', fontSize: '0.95rem', fontWeight: 700 }}>📋 Historical Analysis Records</div>
                    <table>
                      <thead>
                        <tr>
                          <th>Timestamp</th>
                          <th>Pipeline</th>
                          <th>Failure Type</th>
                          <th>Confidence</th>
                          <th>Source</th>
                          <th>Reason</th>
                          <th>Fix Suggestion</th>
                        </tr>
                      </thead>
                      <tbody>
                        {history.slice(0, 15).map(h => (
                          <tr key={h.id}>
                            <td style={{ fontFamily: 'JetBrains Mono', color: 'var(--text-dim)', fontSize: '0.78rem' }}>{h.timestamp}</td>
                            <td><strong style={{ color: '#fff' }}>{h.pipeline}</strong></td>
                            <td>{h.type}</td>
                            <td><span style={{ fontSize: '0.7rem', fontWeight: 700, padding: '0.25rem 0.6rem', borderRadius: '4px', background: 'rgba(16,185,129,0.18)', color: '#4ade80' }}>{h.confidence}</span></td>
                            <td><span style={{ fontSize: '0.7rem', fontWeight: 600, padding: '0.25rem 0.6rem', borderRadius: '4px', background: 'rgba(96,165,250,0.15)', color: '#60a5fa' }}>{h.source.toUpperCase()}</span></td>
                            <td style={{ color: 'var(--text-muted)' }}>{h.reason}</td>
                            <td style={{ color: '#a5b4fc' }}>{h.fix}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE 7: SETTINGS */}
            {currentView === 'settings' && (
              <div>
                <div className="spotlight-card" style={{ padding: '2.4rem', maxWidth: '800px', margin: '0 auto' }}>
                  <div className="spotlight-inner">
                    <div style={{ fontSize: '1.3rem', fontWeight: 700, marginBottom: '0.5rem' }}>⚙️ Enterprise Jenkins &amp; Integration Settings</div>
                    <div style={{ fontSize: '0.86rem', color: 'var(--text-muted)', marginBottom: '1.6rem' }}>Configure live Jenkins cluster, GitHub tokens for automated PRs, and Jira credentials with encrypted at-rest security.</div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1.3rem' }}>
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '1rem 1.2rem', background: 'rgba(255,255,255,0.03)', borderRadius: '12px', border: '1px solid var(--border-glass)' }}>
                        <div>
                          <div style={{ fontWeight: 600, fontSize: '0.92rem' }}>Demo Mode (Local Mock Jenkins)</div>
                          <div style={{ fontSize: '0.76rem', color: 'var(--text-dim)' }}>Switch off to connect to your live enterprise Jenkins cluster</div>
                        </div>
                        <input type="checkbox" checked={settings.demo_mode} onChange={e => setSettings({ ...settings, demo_mode: e.target.checked })} style={{ width: '22px', height: '22px', cursor: 'pointer' }} />
                      </div>

                      <div>
                        <label style={{ fontSize: '0.78rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Jenkins Base URL</label>
                        <input className="form-input" type="text" value={settings.jenkins_url || ''} onChange={e => setSettings({ ...settings, jenkins_url: e.target.value })} placeholder="http://localhost:5000 or https://jenkins.company.com" style={{ width: '100%', marginTop: '6px' }} />
                      </div>

                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                        <div>
                          <label style={{ fontSize: '0.78rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Jenkins Username</label>
                          <input className="form-input" type="text" value={settings.jenkins_user || ''} onChange={e => setSettings({ ...settings, jenkins_user: e.target.value })} placeholder="admin" style={{ width: '100%', marginTop: '6px' }} />
                        </div>
                        <div>
                          <label style={{ fontSize: '0.78rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Jenkins API Token</label>
                          <input className="form-input" type="text" value={settings.jenkins_token || 'demo_token_admin_9872'} onChange={e => setSettings({ ...settings, jenkins_token: e.target.value })} placeholder="demo_token_admin_9872" style={{ width: '100%', marginTop: '6px' }} />
                          <div style={{ fontSize: '0.74rem', color: settings.demo_mode ? '#4ade80' : '#94a3b8', marginTop: '5px' }}>
                            {settings.demo_mode ? '🟢 Demo Token Active (Local Mock Jenkins port 5000)' : '🔑 For Real Jenkins: Jenkins ➔ User ➔ Configure ➔ API Tokens'}
                          </div>
                        </div>
                      </div>

                      <button className="btn btn-purple" style={{ alignSelf: 'flex-start' }} onClick={async () => {
                        setTestResult({ loading: true });
                        try {
                          const res = await fetch('/api/settings/test-jenkins', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ jenkins_url: settings.jenkins_url, jenkins_user: settings.jenkins_user, jenkins_token: settings.jenkins_token, demo_mode: settings.demo_mode })
                          });
                          setTestResult(await res.json());
                        } catch (e) {
                          setTestResult({ success: false, message: "Network connection error" });
                        }
                      }}>
                        <span>📡 Test Jenkins Connection</span>
                      </button>

                      {testResult && (
                        <div style={{ padding: '0.9rem 1.2rem', borderRadius: '10px', background: testResult.success ? 'rgba(16,185,129,0.12)' : 'rgba(239,68,68,0.12)', border: `1px solid ${testResult.success ? 'rgba(16,185,129,0.35)' : 'rgba(239,68,68,0.35)'}`, fontSize: '0.84rem' }}>
                          <strong>{testResult.success ? '✅ Connected: ' : '❌ Connection Failed: '}</strong> {testResult.message}
                        </div>
                      )}

                      <hr style={{ borderColor: 'var(--border-glass)' }} />

                      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '1rem' }}>
                        <button className="btn btn-emerald" onClick={async () => {
                          await fetch('/api/settings', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(settings)
                          });
                          alert("Settings updated and credentials encrypted successfully!");
                          loadAll();
                        }}>Save &amp; Encrypt Settings</button>
                      </div>

                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Floating Bottom Navigation Dock / Footer Bar */}
          <div className="bottom-dock-wrapper">
            <nav className="bottom-dock">
              <button className={`dock-tab tab-overview ${currentView === 'overview' ? 'active' : ''}`} onClick={() => setCurrentView('overview')}>
                <span>⚡</span> <span>Overview &amp; Health</span>
              </button>
              <button className={`dock-tab tab-flow ${currentView === 'how_it_works' ? 'active' : ''}`} onClick={() => setCurrentView('how_it_works')}>
                <span>🔮</span> <span>How It Works</span>
              </button>
              <button className={`dock-tab tab-cli ${currentView === 'terminal' ? 'active' : ''}`} onClick={() => setCurrentView('terminal')}>
                <span>💻</span> <span>Web CLI</span>
              </button>
              <button className={`dock-tab tab-pipelines ${currentView === 'pipelines' ? 'active' : ''}`} onClick={() => setCurrentView('pipelines')}>
                <span>📡</span> <span>Live Pipelines</span>
              </button>
              <button className={`dock-tab tab-actions ${currentView === 'actions' ? 'active' : ''}`} onClick={() => setCurrentView('actions')}>
                <span>🛠</span> <span>Remediation Center</span>
              </button>
              <button className={`dock-tab tab-analytics ${currentView === 'analytics' ? 'active' : ''}`} onClick={() => setCurrentView('analytics')}>
                <span>📊</span> <span>Analytics</span>
              </button>
              <button className={`dock-tab tab-settings ${currentView === 'settings' ? 'active' : ''}`} onClick={() => setCurrentView('settings')}>
                <span>⚙️</span> <span>Settings</span>
              </button>
            </nav>
          </div>

          {/* Action Details Modal */}
          {selectedActionModal && (
            <div className="modal-overlay" onClick={() => setSelectedActionModal(null)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div style={{ padding: '1.5rem 1.8rem', borderBottom: '1px solid var(--border-glass)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                    <span style={{ fontSize: '1.4rem' }}>🛠</span>
                    <div>
                      <div style={{ fontSize: '1.1rem', fontWeight: 700, color: '#fff' }}>Remediation Action #{selectedActionModal.id}</div>
                      <div style={{ fontSize: '0.78rem', color: 'var(--neon-cyan)' }}>Target Pipeline: {selectedActionModal.pipeline}</div>
                    </div>
                  </div>
                  <button onClick={() => setSelectedActionModal(null)} style={{ background: 'transparent', border: 'none', color: 'var(--text-dim)', fontSize: '1.5rem', cursor: 'pointer' }}>✕</button>
                </div>

                <div style={{ padding: '1.8rem', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px' }}>
                    <div style={{ background: '#050811', padding: '0.9rem 1.1rem', borderRadius: '10px', border: '1px solid var(--border-glass)' }}>
                      <div style={{ fontSize: '0.72rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Failure Category</div>
                      <div style={{ fontSize: '0.95rem', fontWeight: 700, color: '#f8fafc', marginTop: '2px' }}>{selectedActionModal.action_type}</div>
                    </div>
                    <div style={{ background: '#050811', padding: '0.9rem 1.1rem', borderRadius: '10px', border: '1px solid var(--border-glass)' }}>
                      <div style={{ fontSize: '0.72rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700 }}>Execution Status</div>
                      <div style={{ fontSize: '0.95rem', fontWeight: 700, color: '#4ade80', marginTop: '2px' }}>✅ {selectedActionModal.status}</div>
                    </div>
                  </div>

                  <div>
                    <div style={{ fontSize: '0.74rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700, marginBottom: '6px' }}>Remediation Description</div>
                    <div style={{ background: '#050811', padding: '1rem 1.2rem', borderRadius: '10px', border: '1px solid var(--border-glass)', fontSize: '0.85rem', color: '#e2e8f0', lineHeight: 1.6 }}>
                      {selectedActionModal.description}
                    </div>
                  </div>

                  {selectedActionModal.external_url && (
                    <div>
                      <div style={{ fontSize: '0.74rem', color: 'var(--text-dim)', textTransform: 'uppercase', fontWeight: 700, marginBottom: '6px' }}>Proof Target URL</div>
                      <a href={selectedActionModal.external_url} target="_blank" rel="noreferrer" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'rgba(6, 182, 212, 0.1)', border: '1px solid rgba(6, 182, 212, 0.35)', padding: '0.9rem 1.2rem', borderRadius: '10px', color: 'var(--neon-cyan)', textDecoration: 'none', fontSize: '0.85rem', fontWeight: 700 }}>
                        <span>🔗 {selectedActionModal.external_url}</span>
                        <span>Open Proof ↗</span>
                      </a>
                    </div>
                  )}

                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '0.8rem' }}>
                    <button className="btn btn-secondary" onClick={() => setSelectedActionModal(null)}>Close</button>
                    {selectedActionModal.external_url && (
                      <a href={selectedActionModal.external_url} target="_blank" rel="noreferrer" className="btn btn-cyan">
                        Open in New Tab ↗
                      </a>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
